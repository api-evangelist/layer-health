name: Layer Health
description: 'Layer Health is a healthcare AI company building a clinical intelligence platform
  that reads longitudinal medical records at scale to automate labor-intensive clinical workflows for
  health systems. Its products span clinical registry abstraction automation (cardiovascular, surgical,
  and oncology registries), clinical pathways that surface guideline-aligned care opportunities and
  eligible patients, site-of-care optimization, and automated quality measurement of custom clinical
  variables. The company positions clinician-validated AI as an embedded workflow layer rather than a
  standalone tool, citing 50%+ time savings on registry abstraction, and works with health systems
  including Johns Hopkins Medicine, Intermountain Health, MultiCare, and White Plains Hospital. Backed
  by GV. As of this enrichment pass Layer Health publishes a marketing and company site only and exposes
  no public API, developer portal, or documentation surface.'
